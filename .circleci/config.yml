version: 2.1

jobs:
  config_cisco:
    machine: true
    resource_class: harutoendo/cisco-resouce

    steps:
      - run:
          name: Test SSH
          command: |
            set -eux

            echo "HOST=$CISCO_HOST"
            echo "USER=$CISCO_USER"

            sshpass -V

            sshpass -p "$CISCO_PASS" ssh \
              -v \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              -o HostKeyAlgorithms=+ssh-rsa \
              -o KexAlgorithms=+diffie-hellman-group14-sha1 \
              "${CISCO_USER}@${CISCO_HOST}" \
              "show clock"

workflows:
  config:
    jobs:
      - config_cisco