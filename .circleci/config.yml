version: 2.1

jobs:
  config_cisco:
    machine: true
    resource_class: harutoendo/cisco-resouce

    steps:
      - run:
          name: Debug runner
          command: |
            echo "===== DEBUG ====="
            whoami
            hostname
            pwd
            which sshpass || true
            ls -l /usr/bin/sshpass || true
            sshpass -V || true

workflows:
  config:
    jobs:
      - config_cisco