vversion: 2.1

jobs:
  config_cisco:
    machine: true
    resource_class: harutoendo/cisco-resouce

    steps:
      - run:
          name: Install expect
          command: |
            set -e

            if ! command -v expect >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y expect
            fi

      - run:
          name: Configure Cisco Hostname
          command: |
            set -euo pipefail

            expect <<'EXPECT_SCRIPT'

            set timeout 30

            set host        $env(CISCO_HOST)
            set username    $env(CISCO_USER)
            set login_pass  $env(CISCO_PASS)
            set enable_pass $env(CISCO_ENABLE)

            spawn ssh \
              -tt \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              -o Ciphers=aes256-cbc,aes192-cbc,aes128-cbc,3des-cbc \
              -o KexAlgorithms=diffie-hellman-group14-sha1,diffie-hellman-group1-sha1,diffie-hellman-group-exchange-sha1 \
              -o HostKeyAlgorithms=+ssh-rsa \
              $username@$host

            expect {
                -nocase "password:" {
                    send "$login_pass\r"
                }
                timeout {
                    puts "SSH login timeout"
                    exit 1
                }
            }

            expect {
                ">" {
                    send "enable\r"
                }
                "#" {
                }
                timeout {
                    puts "Prompt not found"
                    exit 1
                }
            }

            expect {
                -nocase "password:" {
                    send "$enable_pass\r"
                }
                "#" {
                }
                timeout {
                    puts "Enable password prompt not found"
                    exit 1
                }
            }

            expect "#"

            send "terminal length 0\r"
            expect "#"

            send "configure terminal\r"
            expect "(config)#"

            send "no ip domain-lookup\r"
            expect "(config)#"

            send "hostname GP-Router\r"
            expect "(config)#"

            send "end\r"
            expect "#"

            send "write memory\r"

            expect {
                "#" {}
                "\\[OK\\]" {
                    expect "#"
                }
                timeout {
                    puts "write memory timeout"
                    exit 1
                }
            }

            send "show running-config | include ^hostname\r"

            expect {
                "hostname GP-Router" {
                    puts "SUCCESS: hostname changed"
                }
                timeout {
                    puts "hostname verification failed"
                    exit 1
                }
            }

            send "exit\r"
            expect eof

            EXPECT_SCRIPT

workflows:
  config:
    jobs:
      - config_cisco