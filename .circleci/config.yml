version: 2.1

jobs:
  config_cisco:
    machine: true
    resource_class: harutoendo/cisco-resouce

    steps:
      - run:
          name: Configure Hostname
          command: |
            {
              printf '%s\r\n' \
              'enable' \
              'Jstech001!' \
              'configure terminal' \
              'hostname GP-Router' \
              'end' \
              'write memory'
            } | sshpass -p 'cisco1' ssh -tt \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              -o HostKeyAlgorithms=+ssh-rsa \
              -o KexAlgorithms=+diffie-hellman-group14-sha1 \
              -o Ciphers=aes256-cbc,aes192-cbc,aes128-cbc,3des-cbc \
              -o MACs=+hmac-sha1 \
              admin1@10.18.18.170

workflows:
  config:
    jobs:
      - config_cisco